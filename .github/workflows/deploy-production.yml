name: Deploy to Production

# Runs when something is merged / pushed to the `main` branch (or started by hand from the Actions tab).
# It DRY-RUNS (lists what it would upload, uploads nothing) until the repository variable PRODUCTION_DRY_RUN is set to false.
# See DEPLOYMENT_NOTES.md, section 15.
# The `production` environment should have "Required reviewers" turned on, so a person must approve every live deployment.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two production deployments run at the same time.
concurrency:
  group: deploy-production-frontend
  cancel-in-progress: false

jobs:
  # 1. Install, type-check and build. If anything here fails, nothing is deployed.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install, type-check and build
        env:
          # Next.js bakes this address into its /api forwarding when it builds.
          BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_URL }}
        run: |
          test -n "$BACKEND_URL" || { echo "PRODUCTION_BACKEND_URL is not set (GitHub > Settings > Variables)."; exit 1; }
          npm ci
          npm run typecheck
          npm run build

  # 2. Upload the finished files.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check the settings exist
        env:
          DIR: ${{ vars.PRODUCTION_SERVER_DIR }}
          BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_URL }}
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USERNAME }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -z "$DIR" ] && missing="$missing PRODUCTION_SERVER_DIR(variable)"
          [ -z "$BACKEND_URL" ] && missing="$missing PRODUCTION_BACKEND_URL(variable)"
          [ -z "$HOST" ] && missing="$missing SSH_HOST(secret)"
          [ -z "$USER" ] && missing="$missing SSH_USERNAME(secret)"
          [ -z "$KEY" ] && missing="$missing SSH_PRIVATE_KEY(secret)"
          [ -z "$KNOWN" ] && missing="$missing SSH_KNOWN_HOSTS(secret)"
          if [ -n "$missing" ]; then echo "Missing settings:$missing"; exit 1; fi
          case "$DIR" in */) ;; *) echo "PRODUCTION_SERVER_DIR must end with /"; exit 1;; esac

      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build
        env:
          BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_URL }}
        run: |
          npm ci
          npm run build

      # Only what the server needs. NEVER a .env file: real settings are set in hPanel.
      - name: Assemble the deploy package
        run: |
          mkdir -p deploy/tmp
          cp -r .next deploy/.next
          rm -rf deploy/.next/cache
          cp -r public deploy/public
          cp package.json package-lock.json next.config.ts tsconfig.json deploy/
          date -u +"%Y-%m-%dT%H:%M:%SZ" > deploy/tmp/restart.txt

      # Copies over SSH (rsync). Folders are mirrored; .env files and node_modules on the server are never touched.
      - name: Upload over SSH
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USERNAME }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.SSH_KNOWN_HOSTS }}
          PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          DIR: ${{ vars.PRODUCTION_SERVER_DIR }}
          # Stays a dry run (nothing is uploaded) until PRODUCTION_DRY_RUN is set to false.
          DRY: ${{ vars.PRODUCTION_DRY_RUN != 'false' }}
        run: |
          set -e
          install -m 700 -d ~/.ssh
          echo "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$KNOWN" > ~/.ssh/known_hosts
          SSH="ssh -p ${PORT:-65002} -i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"
          FLAGS="-az --itemize-changes --exclude=.env --exclude=.env.* --exclude=node_modules"
          [ "$DRY" = "true" ] && { FLAGS="$FLAGS --dry-run"; echo "DRY RUN: nothing is uploaded."; }
          REMOTE="$USER@$HOST:$DIR"
          for d in deploy/*/; do
            rsync $FLAGS --delete -e "$SSH" "$d" "$REMOTE$(basename "$d")/"
          done
          rsync $FLAGS -e "$SSH" $(find deploy -maxdepth 1 -type f) "$REMOTE"
          rm -f ~/.ssh/deploy_key
