name: Deploy to Staging

# Runs when something is pushed to the `staging` branch (or started by hand from the Actions tab).
# It DRY-RUNS (lists what it would upload, uploads nothing) until the repository variable STAGING_DRY_RUN is set to false.
# See DEPLOYMENT_NOTES.md, section 15.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

# Never let two staging deployments run at the same time.
concurrency:
  group: deploy-staging-frontend
  cancel-in-progress: false

jobs:
  # 1. Install, type-check and build. If anything here fails, nothing is deployed.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install, type-check and build
        env:
          # Next.js bakes this address into its /api forwarding when it builds.
          BACKEND_URL: ${{ vars.STAGING_BACKEND_URL }}
        run: |
          test -n "$BACKEND_URL" || { echo "STAGING_BACKEND_URL is not set (GitHub > Settings > Variables)."; exit 1; }
          npm ci
          npm run typecheck
          npm run build

  # 2. Upload the finished files.
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check the settings exist
        env:
          DIR: ${{ vars.STAGING_SERVER_DIR }}
          BACKEND_URL: ${{ vars.STAGING_BACKEND_URL }}
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USERNAME }}
          PASS: ${{ secrets.STAGING_SSH_PASSWORD }}
          FINGERPRINT: ${{ secrets.STAGING_SSH_HOST_FINGERPRINT }}
        run: |
          missing=""
          [ -z "$DIR" ] && missing="$missing STAGING_SERVER_DIR(variable)"
          [ -z "$BACKEND_URL" ] && missing="$missing STAGING_BACKEND_URL(variable)"
          [ -z "$HOST" ] && missing="$missing STAGING_SSH_HOST(secret)"
          [ -z "$USER" ] && missing="$missing STAGING_SSH_USERNAME(secret)"
          [ -z "$PASS" ] && missing="$missing STAGING_SSH_PASSWORD(secret)"
          [ -z "$FINGERPRINT" ] && missing="$missing STAGING_SSH_HOST_FINGERPRINT(secret)"
          if [ -n "$missing" ]; then echo "Missing settings:$missing"; exit 1; fi
          case "$DIR" in */) ;; *) echo "STAGING_SERVER_DIR must end with /"; exit 1;; esac

      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build
        env:
          BACKEND_URL: ${{ vars.STAGING_BACKEND_URL }}
        run: |
          npm ci
          npm run build

      # Only what the server needs. NEVER a .env file: real settings are set in hPanel.
      - name: Assemble the deploy package
        run: |
          mkdir -p deploy/tmp
          cp -r .next deploy/.next
          rm -rf deploy/.next/cache
          cp -r public deploy/public
          cp package.json package-lock.json next.config.ts tsconfig.json deploy/
          date -u +"%Y-%m-%dT%H:%M:%SZ" > deploy/tmp/restart.txt

      # Copies over SSH (rsync). Folders are mirrored; .env files and node_modules on the server are never touched.
      - name: Upload over SSH
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USERNAME }}
          PASS: ${{ secrets.STAGING_SSH_PASSWORD }}
          FINGERPRINT: ${{ secrets.STAGING_SSH_HOST_FINGERPRINT }}
          PORT: ${{ vars.STAGING_SSH_PORT }}
          DIR: ${{ vars.STAGING_SERVER_DIR }}
          # Stays a dry run (nothing is uploaded) until STAGING_DRY_RUN is set to false.
          DRY: ${{ vars.STAGING_DRY_RUN != 'false' }}
        run: |
          set -e
          sudo apt-get install -y -qq sshpass > /dev/null
          install -m 700 -d ~/.ssh
          # Trust the server only if its ED25519 fingerprint is the one copied from hPanel.
          ssh-keyscan -t ed25519 -p "${PORT:-65002}" "$HOST" > ~/.ssh/scanned 2>/dev/null
          SEEN=$(ssh-keygen -lf ~/.ssh/scanned | awk '{print $2}')
          if [ "$SEEN" != "$FINGERPRINT" ]; then echo "Server fingerprint does not match SSH_HOST_FINGERPRINT (got $SEEN). Not connecting."; exit 1; fi
          mv ~/.ssh/scanned ~/.ssh/known_hosts
          export SSHPASS="$PASS"
          SSH="sshpass -e ssh -p ${PORT:-65002} -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          FLAGS="-az --itemize-changes --exclude=.env --exclude=.env.* --exclude=node_modules"
          [ "$DRY" = "true" ] && { FLAGS="$FLAGS --dry-run"; echo "DRY RUN: nothing is uploaded."; }
          REMOTE="$USER@$HOST:$DIR"
          for d in deploy/*/; do
            rsync $FLAGS --delete -e "$SSH" "$d" "$REMOTE$(basename "$d")/"
          done
          rsync $FLAGS -e "$SSH" $(find deploy -maxdepth 1 -type f) "$REMOTE"
